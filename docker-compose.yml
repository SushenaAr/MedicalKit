services:
  db:
    image: postgres:17-alpine
    container_name: medicalkit-db
    restart: unless-stopped
    # POSTGRES_USER, POSTGRES_PASSWORD и POSTGRES_DB берутся из backend/.env
    env_file: ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - medicalkit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medicalkit-pgdata:
